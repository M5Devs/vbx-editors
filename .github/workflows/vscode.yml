name: Package & Release Extension

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Package VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package Extension (.vsix)
        run: |
          cp LICENSE vscode/LICENSE 2>/dev/null || true
          cd vscode
          npm install -g @vscode/vsce
          vsce package --no-dependencies
          mkdir -p ../dist
          mv *.vsix ../dist/

      # 📦 1. Upload as Artifact (يظهر في صفحة الأكشن فوراً للتحميل)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vbx-vscode-extension
          path: dist/*.vsix

      # 🚀 2. Upload to GitHub Releases (لو Push معمول بـ Tag)
      - name: Upload .vsix to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
